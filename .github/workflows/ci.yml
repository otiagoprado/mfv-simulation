name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Resultado dos testes em formato TAP; cada falha vira uma anotação visível no commit.
      - run: |
          set -o pipefail
          node --test --test-isolation=none --test-reporter=tap tests/*.test.mjs 2>&1 | tee test-output.tap || status=$?
          grep -E '^# (tests|pass|fail)' test-output.tap | sed 's/^/::notice::/'
          grep -E '^\s*not ok' test-output.tap | sed 's/^\s*/::error::/'
          exit ${status:-0}
      - run: pnpm run build
